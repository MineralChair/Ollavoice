<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OllaVoice - local speech for Ollama</title>
<style>
  :root {
    --bg: #12141a; --panel: #1b1e25; --panel2: #1f232b; --line: #2c323d;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #4a7dff; --good: #35c46a; --bad: #e05a5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 "Segoe UI", Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .pill {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; color: var(--muted);
  }
  header .pill b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--bad); margin-right: 5px; vertical-align: middle; }
  .dot.on { background: var(--good); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .chat { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .msg.user { background: #243049; margin-left: 60px; }
  .msg.bot { background: var(--panel2); margin-right: 60px; }
  .msg.sys { background: transparent; color: var(--muted); font-style: italic;
             text-align: center; font-size: 12px; }
  .msg.err { background: #3a2126; color: #ffc9d0; }
  footer {
    padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center;
  }
  footer .wrap { max-width: 860px; margin: 0 auto; display: flex; gap: 10px;
                 align-items: center; width: 100%; }
  input[type=text] {
    flex: 1; background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 9px; padding: 10px 12px; font-size: 14px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 16px; font-size: 14px; cursor: pointer;
    font-weight: 600; white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: #46506450; background: #262c37; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.mic { border-radius: 999px; padding: 10px 20px; }
  button.mic.rec { background: #a32635; border-color: #d63b4d; color: #ffe9ec; }
  label.chk { display: flex; align-items: center; gap: 6px; color: var(--muted);
              font-size: 13px; cursor: pointer; white-space: nowrap; }
  .meter { height: 6px; width: 90px; background: var(--panel2); border-radius: 3px;
           overflow: hidden; border: 1px solid var(--line); }
  .meter > div { height: 100%; width: 0%; background: var(--good); transition: width .08s; }
  .status { font-size: 12px; color: var(--muted); min-width: 130px; }
  .hint { color: var(--muted); font-size: 12px; text-align: center; padding: 4px; }
  code { background: #10131a; padding: 1px 5px; border-radius: 4px; color: #9fd0ff; }
</style>
</head>
<body>
<header>
  <h1>&#127908; OllaVoice</h1>
  <span class="pill"><span class="dot" id="dot"></span><span id="srv">connecting&hellip;</span></span>
  <span class="pill">model <b id="model">-</b></span>
  <span class="pill">ear <b id="stt">-</b></span>
  <span class="pill">mouth <b id="tts">-</b></span>
  <span class="pill">100% local</span>
</header>

<main>
  <div class="chat" id="chat">
    <div class="msg sys">
      This page is served by your own machine and talks only to your local Ollama
      server. Hold the mic button (or <code>Space</code>) and speak.
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <button class="mic" id="mic" title="Hold to talk (Space)">&#127908; Hold to talk</button>
    <div class="meter"><div id="meterFill"></div></div>
    <input type="text" id="text" placeholder="or type a message and press Enter"/>
    <label class="chk"><input type="checkbox" id="speak" checked/> speak replies</label>
    <button class="primary" id="send">Send</button>
  </div>
</footer>
<div class="hint" id="status">idle</div>

<script src="app.js"></script>
</body>
</html>
